<DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLAR SYSTEM · Three.js 실습</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    canvas { display: block; }

    #hud {
      position: absolute; top: 20px; left: 20px;
      pointer-events: none;
    }
    #hud h1 {
      margin: 0 0 6px; font-size: 20px; letter-spacing: 4px; color: #ffd27a;
    }
    #hud p { margin: 2px 0; font-size: 13px; color: #bbb; }

    #panel {
      position: absolute; top: 20px; right: 20px; width: 220px;
      background: rgba(10, 15, 30, 0.8); border: 1px solid #334; border-radius: 8px;
      padding: 14px 16px; font-size: 13px;
    }
    #panel label { display: block; margin-bottom: 8px; }
    #panel input[type=range] { width: 100%; }
    #panel button {
      margin-top: 6px; width: 100%; padding: 6px;
      background: #223; color: #fff; border: 1px solid #445; border-radius: 4px; cursor: pointer;
    }
    #panel button:hover { background: #334; }

    #info {
      position: absolute; bottom: 20px; left: 20px; max-width: 300px; display: none;
      background: rgba(10, 15, 30, 0.85); border: 1px solid #334; border-radius: 8px;
      padding: 14px 16px;
    }
    #info h2 { margin: 0 0 6px; font-size: 18px; color: #ffd27a; }
    #info p { margin: 4px 0; font-size: 13px; color: #ccc; line-height: 1.5; }

    .label {
      color: #fff; font-size: 12px; padding: 2px 6px;
      background: rgba(0, 0, 0, 0.45); border-radius: 4px;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <h1>SOLAR SYSTEM</h1>
    <p>드래그: 회전 · 휠: 확대/축소</p>
    <p>행성 클릭: 정보 보기 + 따라가기</p>
  </div>

  <div id="panel">
    <label>공전 속도: <span id="speedVal">1.0</span>x
      <input type="range" id="speed" min="0" max="5" step="0.1" value="1">
    </label>
    <label><input type="checkbox" id="orbits" checked> 궤도 표시</label>
    <label><input type="checkbox" id="labels" checked> 이름 표시</label>
    <button id="reset">전체 보기</button>
  </div>

  <div id="info">
    <h2 id="infoName"></h2>
    <p id="infoDesc"></p>
    <p id="infoData"></p>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
